    <h1>隐私政策</h1>
    <p>生效日期：2026年5月12日</p >

    <h2>数据收集</h2>
    <p>本应用会在您主动使用时，收集您输入或选择的游戏进度、评估信息及聊天内容，用于 AI 回复生成。所有数据均在您的设备本地处理后，仅在您主动触发 AI 功能时发送至 DeepSeek API 服务器。</p >

    <h2>数据使用</h2>
    <p>DeepSeek API 仅接收与您请求相关的数据片段，用于生成针对性的康复辅助建议。数据不会用于训练 AI 模型，不会与第三方共享。</p >

    <h2>数据存储</h2>
    <p>您的游戏数据存储在本地设备。AI 对话内容不持久化存储，App 关闭后即清除。</p >

    <h2>联系我们</h2>
    <p>如有任何问题，请通过应用内反馈渠道与我们联系。</p >
